# Netlify detects Next.js automatically and uses its official runtime.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Playwright is only used locally to print the CV and social images.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
